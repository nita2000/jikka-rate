name: Monthly Public Real Estate & Akiya Stats Update

on:
  schedule:
    # 毎月1日 09:00 JST (00:00 UTC) に e-Stat 公的統計更新＆ビルド検証を自動実行
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch and merge public jikka & akiya statistics
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python pipeline/fetch_jikka_stats.py

      - name: Build static JSON datasets
        run: python pipeline/build_datasets.py

      - name: Run pipeline unit tests
        run: python -m unittest discover -s pipeline/tests -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies and build Astro
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build

      - name: Commit and push updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/jikka_cost_trends.csv site/src/data
          if git diff --cached --quiet; then
            echo "データに変更はありません。"
          else
            git commit -m "chore(data): update jikka demolition, akiya tax and hakajimai datasets"
            git push
          fi
